name: build

on:
  workflow_dispatch:

jobs:
  win32:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: "x64"
            os: "windows-2025"
    env:
      VS: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise"
      CC: "ccache clang"
      CXX: "ccache clang++"
      CC_LD: "lld-link"
      CXX_LD: "lld-link"
      CFLAGS: "-march=skylake -mno-gather -ffp-contract=fast -fno-math-errno -flto=thin -fuse-ld=lld -O3 -Xclang -cfguard -Xclang -ehcontguard -fvisibility-from-dllstorageclass -fvisibility-dllexport=hidden -ffunction-sections -fdata-sections -gcodeview-ghash -gno-codeview-command-line -w -Wno-unused-command-line-argument"
      CXXFLAGS: "-march=skylake -mno-gather -ffp-contract=fast -fno-math-errno -flto=thin -fuse-ld=lld -O3 -fvisibility-from-dllstorageclass -fvisibility-dllexport=hidden -ffunction-sections -fdata-sections -gcodeview-ghash -gno-codeview-command-line -w -Wno-unused-command-line-argument"
      LINK: "/subsystem:console,10.0 /osversion:10.0"
      _LINK_: "/opt:icf,ref,lldtailmerge,lldlto=3,lldltocgo=3 /subsystem:console,10.0 /osversion:10.0 /filealign:4096 /timestamp:0 /release /debug:ghash,nodwarf,nosymtab /nodefaultlib:libucrt.lib /defaultlib:ucrt.lib"
      WINDRES: "llvm-rc"
      RUST_LD: "lld-link"
      RUSTC: "rustc --target ${{ matrix.target }}"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: "${{ github.workspace }}\\.ccache"
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Disable autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Get time
        id: get_time
        run: |
          "timestamp=$((Get-Date).Ticks)" >> $env:GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.target }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: ${{ matrix.target }}-

      - name: Install dependencies
        run: |
          python -m pip install meson
          choco install ccache nasm llvm
          ./ci/install-cmake.ps1 -arch ${{ matrix.arch }}

      - name: Update Meson WrapDB
        run: |
          meson wrap update-db
          # Explicitly download wraps, as nested projects may have older versions of them.
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib

      - name: Build
        id: build
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\CMake\bin' -and `
                                                             $_ -ne 'C:\Strawberry\c\bin' }) -join ';'
          $env:PATH = "$pwd\cmake\bin;" + $env:PATH + ';C:\Program Files\NASM'
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.arch }} -host_arch=${{ matrix.arch }}"
          ./ci/build-win32.ps1

      - name: Print build log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./build/meson-logs/meson-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-${{ matrix.target }}
          path: |
            build/mpv.???
            !build/mpv.lib

      - name: Save Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.target }}-${{ steps.get_time.outputs.timestamp }}